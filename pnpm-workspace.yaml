allowBuilds:
  sharp: true
  unrs-resolver: true
# Native dependencies whose install/build scripts we explicitly trust.
# pnpm blocks postinstall scripts by default; these are required:
#   - sharp:         native image optimization used by Next.js
#   - unrs-resolver: native resolver used by eslint-import-resolver
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
