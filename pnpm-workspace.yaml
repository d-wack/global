# Native dependency build scripts we trust (pnpm blocks postinstall by default).
#   - sharp:         native image optimization used by Next.js
#   - unrs-resolver: native resolver used by eslint-import-resolver
#   - esbuild:       bundler used by drizzle-kit's CLI (migrations)
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
